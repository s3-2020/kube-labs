# KØR: kubectl apply -f .   |   SLUK: kubectl delete -f .
# lab-blue-whoami eksoneret på https://lab.kung.dk (wildcard-DNS peger på VIP .60)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: lab, namespace: lab-blue }
spec:
  hostnames: [lab.kung.dk]
  parentRefs:
    - { group: gateway.networking.k8s.io, kind: Gateway, name: traefik-gateway, namespace: kube-system }
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: whoami, port: 80 }]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: lab-tls, namespace: lab-blue }
spec:
  secretName: lab-tls
  issuerRef: { name: letsencrypt-prod, kind: ClusterIssuer }
  dnsNames: [lab.kung.dk]

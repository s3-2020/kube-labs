# Alt-i-én netværksværktøjskasse (dig, tcpdump, curl, ss, iperf3...)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netshoot
  namespace: lab-tools
  labels: { team: lab }
spec:
  replicas: 2
  selector: { matchLabels: { app: netshoot } }
  template:
    metadata: { labels: { app: netshoot } }
    spec:
      containers:
        - name: netshoot
          image: nicolaka/netshoot:v0.13
          command: ["sleep", "infinity"]
          resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { memory: 128Mi } }
